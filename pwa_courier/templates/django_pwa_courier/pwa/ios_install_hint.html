{% load i18n %}<div id="pwa-ios-install-hint" hidden role="status"
     style="position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 9999; padding: .75rem 2.5rem .75rem 1rem; border-radius: .5rem; background: #222; color: #fff; font: 14px/1.4 system-ui, sans-serif;">
    {% blocktranslate with name=PWA_MANIFEST.name %}To get notifications from {{ name }}, tap Share and then "Add to Home Screen".{% endblocktranslate %}
    <button type="button" aria-label="{% translate 'Close' %}"
            style="position: absolute; top: .25rem; right: .5rem; background: none; border: 0; color: inherit; font-size: 1.5rem;">&times;</button>
</div>
<script nonce="{{ csp_nonce }}">
  (() => {
    // iOS only allows web push for apps opened from the home screen
    const hint = document.getElementById('pwa-ios-install-hint');
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    const key = 'pwa-ios-install-hint-dismissed';
    if (!isIos || isStandalone || localStorage.getItem(key)) return;
    hint.hidden = false;
    hint.querySelector('button').addEventListener('click', () => {
      hint.hidden = true;
      localStorage.setItem(key, '1');
    });
  })();
</script>
