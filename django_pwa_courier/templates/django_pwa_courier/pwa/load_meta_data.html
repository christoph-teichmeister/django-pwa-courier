{% with favicon=manifest.icons|first %}
    <!-- favicon -->
    <link rel="icon" sizes="{{ favicon.sizes }}" href="{{ favicon.src }}">
    <!-- Path to manifest.json -->
    <link rel="manifest" href="{% url 'django_pwa_courier:manifest' %}">
    <!-- Add to homescreen for Chrome on Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="{{ PWA_MANIFEST.name }}">
    <!-- Chrome for Android theme color -->
    <meta name="theme-color" content="{{ PWA_MANIFEST.theme_color }}">
    <!-- Add to homescreen for Safari on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{{ PWA_MANIFEST.name }}">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">
    {% for icon in PWA_MANIFEST.icons %}
        <link rel="apple-touch-icon" href="{{ icon.src }}" sizes="{{ icon.sizes }}">
    {% endfor %}
    {% for splash in PWA_MANIFEST.splash_screens %}
        <link href="{{ splash.src }}"
              media="{{ splash.media }}"
              rel="apple-touch-startup-image" />
    {% endfor %}
    <!-- Tile for Win8 -->
    <meta name="msapplication-TileColor"
          content="{{ PWA_MANIFEST.background_color }}">
    <meta name="msapplication-TileImage" content="{{ favicon.src }}">
{% endwith %}
